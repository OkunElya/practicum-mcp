<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Practicum</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fff; --fg: #1f2328; --muted: #6e7781; --line: #d0d7de; --soft: #f6f8fa;
      --run: #1a5fb4; --ok: #2a8a2a; --err: #c33; --ask: #b5730a; --user: #e7effa;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1e1f22; --fg: #e6e6e6; --muted: #9a9a9a; --line: #3a3c40; --soft: #26282c;
        --run: #78aeed; --ok: #6c6; --err: #f77; --ask: #e5a50a; --user: #2b3a4f; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 13px/1.45 system-ui, sans-serif; }
    button, select, textarea, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 3px 8px; }
    button:hover { background: var(--soft); }
    select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; min-width: 0; }

    header { border-bottom: 1px solid var(--line); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
    .row { display: flex; gap: 6px; align-items: center; }
    .grow { flex: 1; min-width: 0; }
    .modes { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .modes button { border: 0; border-radius: 0; padding: 3px 10px; }
    .modes button[aria-pressed=true] { background: var(--run); color: #fff; font-weight: 600; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
    .dot.on { background: var(--ok); }
    .dot.busy { background: var(--run); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
    .status { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status b { color: var(--fg); font-weight: 600; }
    .status.thinking b, .status.acting b { color: var(--run); }
    .status.waiting_user b { color: var(--ask); }
    .status.done b { color: var(--ok); } .status.stopped b { color: var(--err); }
    #agentbar { display: flex; flex-direction: column; gap: 6px; }
    #agentbar select { flex: 1; }
    .think { gap: 8px; }
    .think-label { color: var(--muted); flex: none; }
    .slider { display: flex; flex-direction: column; min-width: 0; }
    .slider input { width: 100%; margin: 0; accent-color: var(--run); cursor: pointer; }
    .slider.auto input { opacity: .45; }
    /* Tick labels centred under the thumb's stops (the thumb is ~16px wide). */
    .ticks { display: flex; justify-content: space-between; padding: 0 7px; font-size: 11px; color: var(--muted); user-select: none; }
    .ticks span { width: 0; display: flex; justify-content: center; white-space: nowrap; cursor: pointer; }
    .ticks span.on { color: var(--run); font-weight: 600; }
    .slider.auto .ticks span.on { color: var(--muted); font-weight: 400; }
    button.chip { flex: none; border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--muted); }
    button.chip[aria-pressed=true] { border-color: var(--run); color: var(--run); font-weight: 600; }

    #timeline { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .empty { margin: auto; color: var(--muted); text-align: center; max-width: 260px; }
    .user { align-self: flex-end; max-width: 88%; background: var(--user); padding: 6px 10px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .text { overflow-wrap: anywhere; }
    .text p { margin: 0 0 6px; white-space: pre-wrap; }
    .text p:last-child { margin-bottom: 0; }
    .text pre, .tool pre { background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 4px 0; overflow: auto; max-height: 260px; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.4 ui-monospace, monospace; }
    code { font: 12px ui-monospace, monospace; background: var(--soft); padding: 0 3px; border-radius: 3px; }
    .text.streaming::after { content: '▍'; color: var(--run); animation: pulse 1s infinite; }

    details > summary { cursor: pointer; list-style: none; display: flex; gap: 6px; align-items: baseline; user-select: none; }
    details > summary::-webkit-details-marker { display: none; }
    details > summary::before { content: '▸'; color: var(--muted); flex: none; width: 10px; }
    details[open] > summary::before { content: '▾'; }
    .sum { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .thinking { color: var(--muted); }
    .thinking .sum { font-style: italic; }
    .thinking .body { white-space: pre-wrap; overflow-wrap: anywhere; border-left: 2px solid var(--line); padding: 2px 0 2px 10px; margin: 4px 0 0 4px; max-height: 360px; overflow: auto; font-size: 12px; }
    .thinking.streaming .sum { animation: pulse 1.6s infinite; }

    .tool { border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
    .tool .icon { flex: none; }
    .tool.running .icon, .tool.queued .icon { color: var(--run); }
    .tool.running .icon { animation: pulse 1s infinite; }
    .tool.ok .icon { color: var(--ok); }
    .tool.error .icon { color: var(--err); }
    .tool.denied .icon, .tool.stopped .icon, .tool.approval .icon { color: var(--ask); }
    .tool .name { font-weight: 600; flex: none; }
    .tool .args { color: var(--muted); }
    .tool .meta { margin-left: auto; color: var(--muted); flex: none; font-size: 11px; }
    .badge { font-size: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); flex: none; }
    .tool .label { color: var(--muted); font-size: 11px; margin-top: 6px; text-transform: uppercase; letter-spacing: .04em; }
    .tool ul { margin: 2px 0; padding-left: 16px; color: var(--muted); }
    .tool.error pre.result { border-color: var(--err); }

    .note { color: var(--muted); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; border-left: 2px solid var(--line); padding-left: 8px; }
    .note .body { margin-top: 2px; }
    .q { border-left: 2px solid var(--ask); padding-left: 8px; font-size: 12px; }
    .q .who { color: var(--ask); font-weight: 600; }

    footer { border-top: 1px solid var(--line); padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
    .card { border: 1px solid var(--ask); background: color-mix(in srgb, var(--ask) 12%, transparent); border-radius: 8px; padding: 8px; }
    .card p { margin: 0 0 6px; font-weight: 600; overflow-wrap: anywhere; }
    .card pre { margin: 0 0 6px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 180px; overflow: auto; font: inherit; }
    .card .row { flex-wrap: wrap; }
    button.approve { border-color: var(--ok); color: var(--ok); font-weight: 600; }
    button.deny, button.stop { border-color: var(--err); color: var(--err); }
    button.stop { font-weight: 600; }
    button.primary { background: var(--run); border-color: var(--run); color: #fff; font-weight: 600; }
    .card input { flex: 1; min-width: 120px; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; background: var(--bg); }
    .composer { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
    .composer:focus-within { border-color: var(--run); }
    textarea { border: 0; outline: 0; resize: none; background: transparent; min-height: 40px; max-height: 200px; }
    .hint { color: var(--muted); font-size: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <div class="modes" role="group" aria-label="Mode">
        <button id="mode-mcp" aria-pressed="false" title="An MCP client drives; this panel shows its calls">MCP</button>
        <button id="mode-agent" aria-pressed="false" title="Chat with the agent the bridge runs">Agent</button>
      </div>
      <span class="grow"></span>
      <span id="dot" class="dot" title="bridge"></span>
      <button id="clear" title="Start over: clear the timeline (and the agent's conversation)">New chat</button>
    </div>
    <div id="agentbar" hidden>
      <div class="row"><select id="model" title="Who drives: a local Ollama model or Практикум ИИ"></select></div>
      <div class="row think" id="thinkrow" title="How much the model reasons before it answers (models that support it)">
        <span class="think-label">Thinking</span>
        <div class="slider grow" id="think-slider">
          <input type="range" id="think" min="0" max="3" step="1" value="2" aria-label="Thinking level">
          <div class="ticks"><span>off</span><span>low</span><span>medium</span><span>high</span></div>
        </div>
        <button id="think-auto" class="chip" aria-pressed="true" title="Let the model decide (its default)">auto</button>
      </div>
    </div>
    <div id="status" class="status"></div>
  </header>
  <main id="timeline"></main>
  <footer>
    <div id="approval" class="card" hidden></div>
    <div id="question" class="card" hidden></div>
    <div id="composer" class="composer" hidden>
      <textarea id="input" rows="2" placeholder="Ask the agent to do something on Practicum…"></textarea>
      <div class="row">
        <span id="composer-hint" class="hint grow">Enter to send · Shift+Enter new line</span>
        <button id="stop" class="stop" hidden title="Stop the run (Esc)">Stop</button>
        <button id="send" class="primary">Send</button>
      </div>
    </div>
    <div id="footer-hint" class="hint" hidden></div>
    <div class="row" id="mcp-stop" hidden><button class="stop grow" id="stop2">Stop</button></div>
  </footer>
  <script src="sidebar.js"></script>
</body>
</html>
