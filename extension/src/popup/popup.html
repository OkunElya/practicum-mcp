<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Practicum MCP</title>
  <style>
    :root { color-scheme: light dark; --muted: #777; --ok: #2a8a2a; --bad: #c33; }
    body { font: 13px system-ui, sans-serif; width: 300px; margin: 0; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    #status { padding: 6px 8px; border-radius: 4px; background: #8882; margin-bottom: 10px; }
    #status.connected { color: var(--ok); }
    #status.bad_token, #status.disconnected { color: var(--bad); }
    label { display: block; margin: 8px 0 2px; color: var(--muted); }
    input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 4px; }
    .row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
    .row label { margin: 0; color: inherit; }
    .buttons { display: flex; gap: 6px; margin-top: 12px; }
    button { flex: 1; padding: 5px; }
    #stop { color: var(--bad); font-weight: 600; }
    #current { margin: 10px 0 4px; font-weight: 600; }
    #log { list-style: none; margin: 0; padding: 0; max-height: 140px; overflow: auto; color: var(--muted); }
    #log li { overflow-wrap: anywhere; }
    #log .error { color: var(--bad); } #log .ok { color: var(--ok); }
    .modes { display: flex; border: 1px solid #8886; border-radius: 6px; overflow: hidden; margin-bottom: 4px; }
    .modes button { border: 0; border-radius: 0; background: transparent; padding: 6px; }
    .modes button[aria-pressed=true] { background: #1a5fb4; color: #fff; font-weight: 600; }
    .note { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
  </style>
</head>
<body>
  <h1>Practicum MCP</h1>
  <div id="status">…</div>
  <div class="modes" role="group" aria-label="Mode">
    <button id="mode-mcp" aria-pressed="false" title="An MCP client (Claude Code, …) drives; a small overlay in the page shows its calls">MCP</button>
    <button id="mode-agent" aria-pressed="false" title="The bridge runs the agent; chat with it in the sidebar">Agent chat</button>
  </div>
  <div class="note" id="mode-note"></div>
  <div class="buttons" style="margin-top:0"><button id="open-sidebar" title="Alt+Shift+P">Open sidebar</button></div>
  <label for="url">Bridge URL</label>
  <input id="url" type="text" spellcheck="false">
  <label for="token">Token (printed by the bridge on start)</label>
  <input id="token" type="password" spellcheck="false">
  <div class="row">
    <input id="confirm" type="checkbox">
    <label for="confirm">Ask me before irreversible actions</label>
  </div>
  <div class="buttons">
    <button id="save">Save &amp; connect</button>
    <button id="reconnect">Reconnect</button>
  </div>
  <div id="current"></div>
  <ol id="log"></ol>
  <div class="buttons"><button id="stop">Stop all actions</button></div>
  <script src="popup.js"></script>
</body>
</html>
