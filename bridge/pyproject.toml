[project]
name = "practicum-bridge"
version = "0.1.0"
description = "MCP server bridging to the Practicum browser extension"
readme = "README.md"
authors = [
    { name = "OkunElya", email = "okun.elya@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.20",
    "websockets>=14",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
