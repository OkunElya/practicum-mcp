[project]
name = "practicum-bridge"
version = "0.2.4"
description = "MCP server bridging to the Practicum browser extension"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "OkunElya", email = "okun.elya@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.20",
    "websockets>=14",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
practicum-bridge = "practicum_bridge.__main__:main"
practicum-call = "practicum_bridge.call:main"
practicum-platform-agent = "practicum_bridge.platform_agent:main"
practicum-local-agent = "practicum_bridge.platform_agent:local_main"
practicum-chat = "practicum_bridge.chat:main"
